<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>11 ACAD D1 - Home</title>
<meta name="description" content="Quick access portal for attendance, cleaners, and noise logs.">

<style>
  @font-face {
    font-family: 'SF Pro Text';
    src: url('SF-Pro-Text-Regular.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'SF Pro Text';
    src: url('SF-Pro-Text-Medium.otf') format('opentype');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'SF Pro Text';
    src: url('SF-Pro-Text-Bold.otf') format('opentype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'SF Pro Text';
    src: url('SF-Pro-Text-Heavy.otf') format('opentype');
    font-weight: 800;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'SF Pro Text';
    src: url('SF-Pro-Text-Black.otf') format('opentype');
    font-weight: 900;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #000000;
    --surface: #1c1c1e;
    --surface-2: #2c2c2e;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.18);
    --text-primary: #f5f5f7;
    --text-secondary: rgba(235,235,245,0.6);
    --accent: #0a84ff;
    --radius: 20px;
  }

  * { box-sizing: border-box; }

  html, body {
    min-height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: transparent;
    color: var(--text-primary);
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  /* Blurred aurora confined to the top of the viewport, fading into a dark base beneath it */
  html { background: #05060a; }
  body::before { content: ""; position: fixed; z-index: -2; inset: 0; pointer-events: none; background: #05060a; }
  body::after {
    content: "";
    position: fixed;
    z-index: -1;
    left: -22%;
    right: -22%;
    top: -22%;
    height: 85vh;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 15% 16%, rgba(111,20,63,.78) 0%, rgba(111,20,63,0) 42%),
      radial-gradient(ellipse at 79% 18%, rgba(112,65,31,.72) 0%, rgba(112,65,31,0) 39%),
      radial-gradient(ellipse at 18% 78%, rgba(43,23,112,.88) 0%, rgba(43,23,112,0) 43%),
      radial-gradient(ellipse at 78% 78%, rgba(12,49,72,.82) 0%, rgba(12,49,72,0) 42%),
      radial-gradient(ellipse at 49% 45%, rgba(63,22,64,.38) 0%, rgba(63,22,64,0) 45%),
      linear-gradient(145deg, #21101d 0%, #151022 48%, #081722 100%);
    background-size: 145% 145%;
    background-position: 50% 30%;
    filter: blur(62px) saturate(125%);
    opacity: .96;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 92%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 92%);
    transform: translate3d(0,0,0);
    will-change: transform;
    animation: auroraDrift 22s ease-in-out infinite alternate;
  }
  /* Driven purely by transform (no background-position) so the browser only
     has to recomposite an already-blurred layer each frame, not re-blur it. */
  @keyframes auroraDrift {
    0% { transform: translate3d(-3%,1%,0) scale(1.05); }
    35% { transform: translate3d(3%,-1.5%,0) scale(1.12); }
    70% { transform: translate3d(-1.5%,2%,0) scale(1.08); }
    100% { transform: translate3d(2.5%,-0.5%,0) scale(1.14); }
  }
  @media (prefers-reduced-motion: reduce) {
    body::after { animation: none; }
  }

  main {
    width: 100%;
    max-width: 920px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  .eyebrow {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-primary);
    margin: 0 0 12px;
  }

  h1 {
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }

  .subtitle {
    font-size: clamp(15px, 2vw, 17px);
    font-weight: 400;
    color: var(--text-secondary);
    margin: 0;
    max-width: 480px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    width: 100%;
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    padding: 28px 24px;
    background: rgba(28, 28, 30, 0.6);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    text-decoration: none;
    color: var(--text-primary);
    overflow: hidden;
    will-change: transform;
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.35s ease,
                box-shadow 0.35s ease,
                background 0.35s ease;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.08), transparent 60%);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  .card:hover,
  .card:focus-visible {
    transform: translateY(-4px) scale(1.015);
    border-color: var(--border-hover);
    background: rgba(44, 44, 46, 0.7);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
  }

  .card:hover::before,
  .card:focus-visible::before {
    opacity: 1;
  }

  .card:active {
    transform: translateY(-1px) scale(0.99);
  }

  .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon svg {
    width: 22px;
    height: 22px;
    stroke: var(--text-primary);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .card-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .card-desc {
    font-size: 13.5px;
    font-weight: 400;
    color: var(--text-secondary);
    margin: -10px 0 0;
  }

  .arrow {
    margin-top: auto;
    align-self: flex-end;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), background 0.35s ease;
  }

  .card:hover .arrow,
  .card:focus-visible .arrow {
    background: var(--accent);
    transform: translateX(3px);
  }

  .arrow svg {
    width: 14px;
    height: 14px;
    stroke: var(--text-primary);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
    header { margin-bottom: 36px; }
  }

  /* Mobile perf: per-card backdrop-filter blur is costly to composite when
     several cards are on screen at once (every scroll frame re-blurs each
     card's backdrop). Swap to a solid-enough background instead. */
  @media (max-width: 700px) {
    .card {
      background: #1c1c1e;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .card:hover,
    .card:focus-visible {
      background: #2c2c2e;
    }
  }
</style>
</head>
<body>

<main>
  <header>
    <p class="eyebrow">11 ACAD D1 AM</p>
    <h1>Hello there!</h1>
    <p class="subtitle">Quick access to attendance, cleaning duty, and noise records.</p>
  </header>

  <div class="grid" role="list" aria-label="Portal links">

    <a class="card" role="listitem" href="https://rxnaldrei.github.io/11acadd1am-2627/attendance.html" aria-label="Open Attendance tracker">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="4"/><path d="M8 2v4M16 2v4M3 10h18"/><path d="m8.5 14.5 2 2 4.5-4.5"/></svg>
      </div>
      <h2 class="card-title">Attendance</h2>
      <p class="card-desc">Mark and review class attendance.</p>
      <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>

    <a class="card" role="listitem" href="https://rxnaldrei.github.io/11acadd1am-2627/cleaners.html" aria-label="Open List of Cleaners">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3v3M5 7l1.5 1.5M19 7l-1.5 1.5"/><path d="M12 9c3 0 5 2 5 5 0 3-2 7-5 7s-5-4-5-7c0-3 2-5 5-5Z"/><path d="M9 21h6"/></svg>
      </div>
      <h2 class="card-title">List of Cleaners</h2>
      <p class="card-desc">See who's assigned to clean.</p>
      <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>

    <a class="card" role="listitem" href="https://rxnaldrei.github.io/11acadd1am-2627/noisy.html" aria-label="Open List of Noisy">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10H3Z"/><path d="M16 9c1 1 1 5 0 6M19 7c2 2 2 8 0 10"/></svg>
      </div>
      <h2 class="card-title">List of Noisy</h2>
      <p class="card-desc">Track noise log entries.</p>
      <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>

  </div>
</main>

</body>
</html>
