<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>11 ACAD D1 - Home</title>
<meta name="description" content="Quick access portal for attendance, cleaners, and noise logs.">

<style>
  /* Apple-inspired SF Pro Text typography. Keep Commuters Sans for the class label. */
  @font-face {
    font-family: 'SF Pro Text';
    src: url('https://rxnaldrei.github.io/11acadd1am-2627/SF-Pro-Text-Regular.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'SF Pro Text';
    src: url('https://rxnaldrei.github.io/11acadd1am-2627/SF-Pro-Text-Medium.otf') format('opentype');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'SF Pro Text';
    src: url('https://rxnaldrei.github.io/11acadd1am-2627/SF-Pro-Text-Bold.otf') format('opentype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'SF Pro Text';
    src: url('https://rxnaldrei.github.io/11acadd1am-2627/SF-Pro-Text-Heavy.otf') format('opentype');
    font-weight: 800;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'SF Pro Text';
    src: url('https://rxnaldrei.github.io/11acadd1am-2627/SF-Pro-Text-Black.otf') format('opentype');
    font-weight: 900;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'Commuters Sans';
    src: url('commuterssans-bold.otf') format('opentype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #000000;
    --surface: #1c1c1e;
    --surface-2: #2c2c2e;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.18);
    --text-primary: #f5f5f7;
    --text-secondary: rgba(235,235,245,0.6);
    --accent: #0a84ff;
    --radius: 20px;
    --text-eyebrow: clamp(0.75rem, 0.72rem + 0.12vw, 0.8125rem);
    --text-title: clamp(2.125rem, 1.65rem + 1.65vw, 2.875rem);
    --text-subtitle: clamp(1rem, 0.94rem + 0.2vw, 1.125rem);
    --text-card-title: clamp(1.0625rem, 1.02rem + 0.15vw, 1.1875rem);
    --text-card-description: clamp(0.875rem, 0.84rem + 0.12vw, 0.9375rem);
  }

  * {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* Keep the page text from being selected or copied through normal UI actions. */
  html, body { -webkit-user-select: none; user-select: none; }

  html, body {
    min-height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    color: var(--text-primary);
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  /* Blurred aurora confined to the top of the viewport, fading into a dark base beneath it */
  html { background: #05060a; }
  body::before { content: ""; position: fixed; z-index: -2; inset: 0; pointer-events: none; background: #05060a; }
  body::after {
    content: "";
    position: fixed;
    z-index: -1;
    left: -22%;
    right: -22%;
    top: -22%;
    height: 85vh;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 15% 16%, rgba(111,20,63,.78) 0%, rgba(111,20,63,0) 42%),
      radial-gradient(ellipse at 79% 18%, rgba(112,65,31,.72) 0%, rgba(112,65,31,0) 39%),
      radial-gradient(ellipse at 18% 78%, rgba(43,23,112,.88) 0%, rgba(43,23,112,0) 43%),
      radial-gradient(ellipse at 78% 78%, rgba(12,49,72,.82) 0%, rgba(12,49,72,0) 42%),
      radial-gradient(ellipse at 49% 45%, rgba(63,22,64,.38) 0%, rgba(63,22,64,0) 45%),
      linear-gradient(145deg, #21101d 0%, #151022 48%, #081722 100%);
    background-size: 145% 145%;
    background-position: 50% 30%;
    filter: blur(62px) saturate(125%);
    opacity: .96;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 92%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 92%);
    transform: translate3d(0,0,0);
    animation: auroraDrift 22s ease-in-out infinite alternate;
  }
  /* Driven purely by transform (no background-position) so the browser only
     has to recomposite an already-blurred layer each frame, not re-blur it. */
  @keyframes auroraDrift {
    0% { transform: translate3d(-3%,1%,0) scale(1.05); }
    35% { transform: translate3d(3%,-1.5%,0) scale(1.12); }
    70% { transform: translate3d(-1.5%,2%,0) scale(1.08); }
    100% { transform: translate3d(2.5%,-0.5%,0) scale(1.14); }
  }
  @media (prefers-reduced-motion: reduce) {
    body::after { animation: none; }
  }

  main {
    width: 100%;
    max-width: 920px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  .eyebrow {
    font-family: 'Commuters Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 700;
    font-size: var(--text-eyebrow);
    line-height: 1.4;
    font-weight: 600;
    letter-spacing: 0.015em;
    word-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-primary);
    margin: 0 0 12px;
  }

  h1 {
    font-size: var(--text-title);
    line-height: 1.08;
    font-weight: 900;
    letter-spacing: -0.035em;
    margin: 0 0 14px;
  }

  .hello-logo {
    display: block;
    width: min(100%, 230px);
    height: auto;
    margin: 0 auto 14px;
    overflow: visible;
  }

  .subtitle {
    font-size: var(--text-subtitle);
    line-height: 1.5;
    font-weight: 400;
    color: var(--text-secondary);
    margin: 0;
    max-width: 480px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    width: 100%;
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    padding: 28px 24px;
    background: rgba(28, 28, 30, 0.6);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    text-decoration: none;
    color: var(--text-primary);
    overflow: hidden;
    transform: perspective(900px) rotateX(var(--tilt-y, 0deg)) rotateY(var(--tilt-x, 0deg)) translateY(0);
    transform-style: preserve-3d;
    transition: transform 220ms ease-out,
                border-color 220ms ease-out,
                box-shadow 220ms ease-out,
                background 220ms ease-out;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.08), transparent 60%);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  .card:hover,
  .card:focus-visible {
    transform: perspective(900px) rotateX(var(--tilt-y, 0deg)) rotateY(var(--tilt-x, 0deg)) translateY(-3px);
    border-color: var(--border-hover);
    background: rgba(44, 44, 46, 0.7);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
  }

  .card:hover::before,
  .card:focus-visible::before {
    opacity: 1;
  }

  .card:active {
    transform: perspective(900px) rotateX(var(--tilt-y, 0deg)) rotateY(var(--tilt-x, 0deg)) translateY(-1px) scale(0.995);
  }

  .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon svg {
    width: 22px;
    height: 22px;
    stroke: var(--text-primary);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .card-title {
    font-size: var(--text-card-title);
    line-height: 1.3;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .card-desc {
    font-size: var(--text-card-description);
    line-height: 1.45;
    font-weight: 400;
    color: var(--text-secondary);
    margin: -10px 0 0;
  }

  /* Subtle Apple-style Edit control: restrained translucency, no glossy shine */
  .card-edit {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 3;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 34px;
    padding: 8px 12px;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 999px;
    background: rgba(10,132,255,.88);
    color: #fff;
    font: 600 13px/1 'SF Pro Text', -apple-system, BlinkMacSystemFont, sans-serif;
    text-decoration: none;
    box-shadow: 0 2px 6px rgba(0,0,0,.16);
    -webkit-backdrop-filter: blur(8px) saturate(125%);
    backdrop-filter: blur(8px) saturate(125%);
    transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
  }

  .card-edit:hover,
  .card-edit:focus-visible {
    background: rgba(0,122,255,.96);
    transform: translateY(-1px);
    box-shadow: 0 3px 9px rgba(0,0,0,.2);
  }

  .card-edit:focus-visible {
    filter: brightness(1.1) saturate(1.08);
    transform: translateY(-1px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.58), inset 0 -1px 0 rgba(0,35,105,.18), 0 5px 14px rgba(0,95,220,.3), 0 1px 3px rgba(0,0,0,.18);
  }

  .card-edit:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }

  .card-edit svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .card-main {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    width: 100%;
    color: inherit;
    text-decoration: none;
  }

  .card-main:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 8px;
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
    header { margin-bottom: 36px; }
    body { padding-left: 20px; padding-right: 20px; }
    h1 { letter-spacing: -0.04em; }
    .subtitle {
      max-width: none;
      width: max-content;
      max-width: calc(100vw - 40px);
      white-space: nowrap;
      font-size: clamp(10px, calc((100vw - 40px) / 28), 18px);
      letter-spacing: -0.025em;
    }
  }

  @media (min-width: 900px) {
    header { margin-bottom: 52px; }
    .grid { gap: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card:hover, .card:focus-visible, .card:active { transform: none; }
  }

  @media (hover: none) and (pointer: coarse) {
    .card, .card-edit, .card::before {
      transition-duration: 0.01ms;
    }
    .card:hover {
      transform: none;
      box-shadow: none;
    }
    .card:hover::before { opacity: 0; }
  }

  /* Mobile perf: per-card backdrop-filter blur is costly to composite when
     several cards are on screen at once (every scroll frame re-blurs each
     card's backdrop). Swap to a solid-enough background instead. */
  @media (max-width: 700px) {
    /* Keep the aurora still on phones to reduce ongoing GPU work. */
    body::after {
      animation: none;
      transform: translate3d(-1%, 0.5%, 0) scale(1.08);
      will-change: auto;
    }
    .grid {
      width: 100%;
      max-width: 380px;
      gap: 14px;
      margin-inline: auto;
    }
    .card {
      padding: 20px;
      gap: 12px;
      background: #1c1c1e;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      will-change: auto;
    }
    .card-main { gap: 12px; }
    .card-edit { top: 12px; right: 12px; }
    .card:hover,
    .card:focus-visible {
      background: #2c2c2e;
    }
  }
</style>

<script>
  // Discourage ordinary text selection and copying. This is a UI restriction,
  // not a security boundary: browser developer tools or page source can bypass it.
  document.addEventListener('selectstart', (event) => event.preventDefault());
  document.addEventListener('copy', (event) => event.preventDefault());
  document.addEventListener('cut', (event) => event.preventDefault());

  // Discourage copying or dragging destination links from the portal buttons.
  document.querySelectorAll('a[href]').forEach((link) => {
    link.setAttribute('draggable', 'false');
    link.addEventListener('contextmenu', (event) => event.preventDefault());
    link.addEventListener('dragstart', (event) => event.preventDefault());
  });
  document.addEventListener('keydown', (event) => {
    const key = event.key.toLowerCase();
    if ((event.ctrlKey || event.metaKey) && key === 'a') {
      event.preventDefault();
      event.stopPropagation();
    }
    if ((event.ctrlKey || event.metaKey) && (key === 'c' || key === 'x')) {
      event.preventDefault();
      event.stopPropagation();
    }
  }, true);
</script>

<script>
  // Lightweight pointer-based tilt: no animation loop, only updates the card
  // currently under the pointer. Touch devices tilt while pressing/moving.
  (() => {
    const cards = document.querySelectorAll('.card');
    const maxTilt = 4;

    function updateTilt(card, event) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const rect = card.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width;
      const y = (event.clientY - rect.top) / rect.height;
      const tiltX = (x - 0.5) * maxTilt * 2;
      const tiltY = (0.5 - y) * maxTilt * 2;
      card.style.setProperty('--tilt-x', tiltX.toFixed(2) + 'deg');
      card.style.setProperty('--tilt-y', tiltY.toFixed(2) + 'deg');
    }

    cards.forEach((card) => {
      card.addEventListener('pointermove', (event) => {
        if (event.pointerType === 'touch' && event.buttons === 0) return;
        updateTilt(card, event);
      }, { passive: true });
      card.addEventListener('pointerleave', () => {
        card.style.setProperty('--tilt-x', '0deg');
        card.style.setProperty('--tilt-y', '0deg');
      }, { passive: true });
      card.addEventListener('pointerdown', (event) => updateTilt(card, event), { passive: true });
      card.addEventListener('pointerup', () => {
        if (window.matchMedia('(hover: none)').matches) {
          card.style.setProperty('--tilt-x', '0deg');
          card.style.setProperty('--tilt-y', '0deg');
        }
      }, { passive: true });
    });
  })();
</script>
