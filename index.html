<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Attendance</title>
<style>
@font-face{font-family:"SF Pro Display Custom";src:url("SF-Pro-Display-Regular.otf") format("opentype");font-style:normal;font-weight:100 900;font-display:swap}
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --label:#000000; --label2:rgba(60,60,67,.6); --sep:rgba(60,60,67,.18);
  --fill:rgba(120,120,128,.12); --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30;
  --blur:rgba(242,242,247,.78); color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --label:#FFFFFF; --label2:rgba(235,235,245,.6); --sep:rgba(84,84,88,.6);
    --fill:rgba(120,120,128,.24); --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A;
    --blur:rgba(0,0,0,.72); color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--label);
  font-family:"SF Pro Display Custom",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px}

.nav{position:sticky;top:0;z-index:5;padding:env(safe-area-inset-top,0px) 0 0;
  background:var(--blur);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--sep)}
.wrap{max-width:680px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.nav .wrap{padding-top:10px;padding-bottom:10px}
h1{margin:0;font-size:34px;font-weight:700;letter-spacing:.37px;line-height:1.15}
.search{margin-top:10px;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:7px 8px}
.search svg{flex:none;width:16px;height:16px;opacity:.6}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:17px}
.search input::placeholder{color:var(--label2)}

main{padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
.group{background:var(--card);border-radius:12px;overflow:hidden;margin:0 0 8px}
.head{margin:24px 16px 7px;font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:-.08px;display:flex;justify-content:space-between}
.foot{margin:7px 16px 0;font-size:13px;color:var(--label2)}

.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:56px;right:0;height:.5px;background:var(--sep)}
.date-row{justify-content:space-between}
.date-row input{background:var(--fill);border:0;border-radius:8px;padding:6px 10px;font-size:17px;min-width:0}
.chev{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--blue);font-size:22px;line-height:1}
.chev:active{background:var(--fill)}
.date-row .mid{display:flex;align-items:center;gap:4px;flex:1;justify-content:center}
.today{color:var(--blue);font-size:17px;padding:6px 8px;border-radius:8px}

.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:14px 8px;text-align:center}
.stat+.stat{border-left:.5px solid var(--sep)}
.stat b{display:block;font-size:28px;font-weight:700;letter-spacing:.36px}
.stat span{font-size:13px;color:var(--label2)}
.stat.p b{color:var(--green)} .stat.l b{color:var(--orange)} .stat.a b{color:var(--red)} .stat.e b{color:var(--blue)}

.check{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--label2);display:grid;place-items:center;
  color:#fff;font-size:14px;font-weight:700;transition:background .15s,border-color .15s,transform .15s}
.check:active{transform:scale(.88)}
.check svg{width:15px;height:15px;display:none}
.s-present .check{background:var(--green);border-color:var(--green)}
.s-present .check svg{display:block}
.s-late .check{background:var(--orange);border-color:var(--orange)}
.s-excused .check{background:var(--blue);border-color:var(--blue)}
.s-absent .check{background:var(--red);border-color:var(--red)}
.name{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}
.s-absent .name{color:var(--label2)}
.pills{display:flex;gap:6px;flex:none}
.pill{padding:5px 11px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:500;color:var(--label2);transition:background .15s,color .15s}
.pill.late[aria-pressed=true]{background:var(--orange);color:#fff}
.pill.absent[aria-pressed=true]{background:var(--red);color:#fff}
.pill.excused[aria-pressed=true]{background:var(--blue);color:#fff}
.days{max-height:340px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.day-row{width:100%;text-align:left;display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 16px;position:relative}
.day-row+.day-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.day-row:active{background:var(--fill)}
.day-row.sel{background:var(--fill)}
.day-row .dn{flex:1;min-width:0}
.day-row .dn small{display:block;font-size:13px;color:var(--label2)}
.day-row .dc{display:flex;gap:10px;font-size:15px;font-weight:600}
.day-row .dc .p{color:var(--green)} .day-row .dc .l{color:var(--orange)} .day-row .dc .a{color:var(--red)} .day-row .dc .e{color:var(--blue)}
.day-row .none{font-size:14px;font-weight:400;color:var(--label2)}
.empty{padding:18px 16px;color:var(--label2);text-align:center}

.action{width:100%;text-align:left;padding:11px 16px;font-size:17px;color:var(--blue);display:block;min-height:44px;position:relative}
.action+.action::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.action:active{background:var(--fill)}
.action.danger{color:var(--red)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(92vw,420px);
  background:rgba(40,40,42,.92);color:#fff;padding:12px 18px;border-radius:16px;font-size:15px;text-align:center;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:480px){.pills{gap:4px}.pill{padding:5px 8px;font-size:13px}.stat b{font-size:24px}}
@media (max-width:380px){.pill{padding:5px 6px;font-size:12px}.row{gap:10px;padding:8px 12px}.row+.row::before{left:50px}}
</style>
</head>
<body>
<header class="nav" id="nav">
  <div class="wrap">
    <h1>Attendance</h1>
    <label class="search">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
      <input id="q" type="search" placeholder="Search" aria-label="Search names" autocomplete="off">
    </label>
  </div>
</header>

<main class="wrap">
  <div class="group" style="margin-top:16px">
    <div class="row date-row">
      <button class="chev" id="prev" aria-label="Previous day">‹</button>
      <div class="mid"><input type="date" id="date" aria-label="Date"><button class="today" id="today">Today</button></div>
      <button class="chev" id="next" aria-label="Next day">›</button>
    </div>
  </div>

  <div class="group stats" aria-live="polite">
    <div class="stat p"><b id="c-present">0</b><span>Present</span></div>
    <div class="stat l"><b id="c-late">0</b><span>Late</span></div>
    <div class="stat a"><b id="c-absent">0</b><span>Absent</span></div>
    <div class="stat e"><b id="c-excused">0</b><span>Excused</span></div>
  </div>
  <p class="foot" id="unmarked"></p>

  <div id="lists"></div>

  <div class="head"><span>All Days</span><span id="daysInfo"></span></div>
  <div class="group days" id="days"></div>
  <p class="foot">Every day since attendance started. Tap a day to open it.</p>

  <div class="head"><span>Actions</span></div>
  <div class="group">
    <button class="action" id="sync">Sync to Google Sheet</button>
    <button class="action" id="syncLink">Change Sync Link…</button>
    <button class="action" id="allPresent">Set Everyone: Present</button>
    <button class="action" id="exportImg">Export as Image</button>
    <button class="action" id="export">Export to Google Sheets / Excel</button>
    <button class="action danger" id="clearDay">Clear This Day</button>
  </div>
  <p class="foot">Tap the circle to mark present. Use Late or Absent for the other options. Marks are saved in this browser. Sync to Google Sheet sends the selected day to your sheet.</p>
</main>

    var u = prompt("Paste your Apps Script web app link (ends in /exec):", getUrl());
    if (u && /^https:\/\//.test(u.trim())){ setUrl(u.trim()); return u.trim(); }
    return "";
  }
  $("syncLink").addEventListener("click", function(){ if (askUrl()) toast("Sync link saved"); });
  $("sync").addEventListener("click", function(){
    var url = getUrl() || askUrl();
    if (!url) return;
    var rec = records[current] || {};
    var list = ALL.filter(function(p){ return rec[p.name]; }).map(function(p){ return {name:p.name, status:rec[p.name]}; });
    if (!list.length){ toast("Nothing is marked for this day yet"); return; }
    var btn = $("sync"); btn.textContent = "Syncing…"; btn.disabled = true;
    fetch(url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({date:current, records:list})})
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.ok) throw new Error(res.error || "Sync failed");
        var m = "Synced " + res.written + " names to " + res.tab + ", column " + res.column;
        if (res.unmatched && res.unmatched.length) m += ". Not found in sheet: " + res.unmatched.join("; ");
        toast(m);
      })
      .catch(function(err){ toast("Could not sync. " + (err && err.message ? err.message : "Check the sync link.")); })
      .then(function(){ btn.textContent = "Sync to Google Sheet"; btn.disabled = false; });
  });

  window.addEventListener("scroll", function(){ $("nav").classList.toggle("scrolled", window.scrollY > 4); }, {passive:true});
  render();
})();
</script>
</body>
</html>
