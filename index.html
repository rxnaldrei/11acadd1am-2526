<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Portal — 11 ACAD D1 AM</title>
<meta name="description" content="Quick access portal for attendance, cleaners, and noise logs.">

<style>
  @font-face {
    font-family: 'SF Pro Text';
    src: url('SF-Pro-Text-Regular.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'SF Pro Text';
    src: url('SF-Pro-Text-Medium.otf') format('opentype');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'SF Pro Text';
    src: url('SF-Pro-Text-Bold.otf') format('opentype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'SF Pro Text';
    src: url('SF-Pro-Text-Heavy.otf') format('opentype');
    font-weight: 800;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'SF Pro Text';
    src: url('SF-Pro-Text-Black.otf') format('opentype');
    font-weight: 900;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #000000;
    --surface: #1c1c1e;
    --surface-2: #2c2c2e;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.18);
    --text-primary: #f5f5f7;
    --text-secondary: rgba(235,235,245,0.6);
    --accent: #0a84ff;
    --radius: 20px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #000000;
    color: var(--text-primary);
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  /* Ambient aurora backdrop: a few large, cheap, blurred blobs that
     drift slowly. Fixed + GPU-composited so scrolling/resizing stays
     smooth, and capped in size/blur so mobile GPUs don't choke. */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background: #000000;
  }

  .aurora::after {
    /* fade the colorful top into solid black toward the bottom,
       exactly like the reference screenshot */
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 0%, transparent 25%, #000000 70%);
    z-index: 1;
  }

  .blob {
    position: absolute;
    width: 70vw;
    height: 70vw;
    max-width: 560px;
    max-height: 560px;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.75;
    will-change: transform;
    transform: translate3d(0,0,0);
  }

  .blob-1 {
    top: -20%;
    left: -10%;
    background: #7b3fe4;
    animation: drift1 22s ease-in-out infinite;
  }

  .blob-2 {
    top: -25%;
    right: -15%;
    background: #e05a3c;
    animation: drift2 26s ease-in-out infinite;
  }

  .blob-3 {
    top: -5%;
    left: 20%;
    background: #2d6ae0;
    animation: drift3 30s ease-in-out infinite;
  }

  @keyframes drift1 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50% { transform: translate3d(6%, 8%, 0) scale(1.08); }
  }

  @keyframes drift2 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50% { transform: translate3d(-8%, 6%, 0) scale(1.05); }
  }

  @keyframes drift3 {
    0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
    50% { transform: translate3d(4%, -6%, 0) scale(1.1); }
  }

  /* Respect reduced-motion and also hard-disable on small/low-power
     screens' battery by just freezing the frame — still shows the
     gradient, just no animation cost */
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none !important; }
  }

  /* Smaller, slightly less blurred blobs on narrow screens:
     fewer pixels for the GPU to blur each frame */
  @media (max-width: 480px) {
    .blob {
      width: 85vw;
      height: 85vw;
      filter: blur(50px);
    }
  }

  main {
    width: 100%;
    max-width: 920px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  .eyebrow {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 12px;
  }

  h1 {
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }

  .subtitle {
    font-size: clamp(15px, 2vw, 17px);
    font-weight: 400;
    color: var(--text-secondary);
    margin: 0;
    max-width: 480px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    width: 100%;
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    padding: 28px 24px;
    background: rgba(28, 28, 30, 0.6);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    text-decoration: none;
    color: var(--text-primary);
    overflow: hidden;
    will-change: transform;
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.35s ease,
                box-shadow 0.35s ease,
                background 0.35s ease;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.08), transparent 60%);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  .card:hover,
  .card:focus-visible {
    transform: translateY(-4px) scale(1.015);
    border-color: var(--border-hover);
    background: rgba(44, 44, 46, 0.7);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
  }

  .card:hover::before,
  .card:focus-visible::before {
    opacity: 1;
  }

  .card:active {
    transform: translateY(-1px) scale(0.99);
  }

  .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon svg {
    width: 22px;
    height: 22px;
    stroke: var(--text-primary);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .card-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .card-desc {
    font-size: 13.5px;
    font-weight: 400;
    color: var(--text-secondary);
    margin: -10px 0 0;
  }

  .arrow {
    margin-top: auto;
    align-self: flex-end;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), background 0.35s ease;
  }

  .card:hover .arrow,
  .card:focus-visible .arrow {
    background: var(--accent);
    transform: translateX(3px);
  }

  .arrow svg {
    width: 14px;
    height: 14px;
    stroke: var(--text-primary);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  footer {
    margin-top: 56px;
    font-size: 12px;
    color: rgba(235,235,245,0.35);
    text-align: center;
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
    header { margin-bottom: 36px; }
  }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<main>
  <header>
    <p class="eyebrow">11 ACAD D1 AM</p>
    <h1>Class Portal</h1>
    <p class="subtitle">Quick access to attendance, cleaning duty, and noise records.</p>
  </header>

  <div class="grid" role="list" aria-label="Portal links">

    <a class="card" role="listitem" href="https://rxnaldrei.github.io/11acadd1am-2627/attendance.html" target="_blank" rel="noopener noreferrer" aria-label="Open Attendance tracker in a new tab">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="4"/><path d="M8 2v4M16 2v4M3 10h18"/><path d="m8.5 14.5 2 2 4.5-4.5"/></svg>
      </div>
      <h2 class="card-title">Attendance</h2>
      <p class="card-desc">Mark and review class attendance.</p>
      <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>

    <a class="card" role="listitem" href="https://rxnaldrei.github.io/11acadd1am-2627/cleaners.html" target="_blank" rel="noopener noreferrer" aria-label="Open List of Cleaners in a new tab">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3v3M5 7l1.5 1.5M19 7l-1.5 1.5"/><path d="M12 9c3 0 5 2 5 5 0 3-2 7-5 7s-5-4-5-7c0-3 2-5 5-5Z"/><path d="M9 21h6"/></svg>
      </div>
      <h2 class="card-title">List of Cleaners</h2>
      <p class="card-desc">See who's assigned to clean.</p>
      <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>

    <a class="card" role="listitem" href="https://rxnaldrei.github.io/11acadd1am-2627/noisy.html" target="_blank" rel="noopener noreferrer" aria-label="Open List of Noisy in a new tab">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10H3Z"/><path d="M16 9c1 1 1 5 0 6M19 7c2 2 2 8 0 10"/></svg>
      </div>
      <h2 class="card-title">List of Noisy</h2>
      <p class="card-desc">Track noise log entries.</p>
      <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>

  </div>

  <footer>
    <p>11 ACAD D1 AM &middot; 2026&ndash;2027</p>
  </footer>
</main>

</body>
</html>
