<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06204b">
<title>Start</title>
<style>
:root{color-scheme:dark;--bg:#06204b;--tile:#0878d1;--white:#f7f9fc}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--white)}
body{min-height:100vh;overflow-x:hidden}
button,a{-webkit-tap-highlight-color:transparent}
.start{min-height:100vh;padding:34px clamp(24px,7vw,100px) 60px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:52px}
h1{font-size:42px;line-height:1.1;font-weight:300;letter-spacing:-1.5px;margin:0}
.account{display:flex;align-items:center;gap:10px;font-size:18px;color:#f5f7fb}
.account-icon{width:30px;height:30px;background:#e8edf4;display:grid;place-items:center;color:#526174}
.content{max-width:1050px;margin:0 auto}
.section-title{font-size:18px;font-weight:400;margin:0 0 14px 2px;color:#e4edf9}
.app-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:104px;gap:5px;max-width:850px}
.app-tile{grid-column:span 2;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;text-decoration:none;color:white;background:#0878d1;outline:1px solid transparent;outline-offset:-1px;transition:filter .15s,outline-color .15s}
.app-tile[href="./attendance.html"]{background:#0878d1}
.app-tile[href="./info.html"]{background:#6b2ca0}
.app-tile:hover{filter:brightness(1.12);outline-color:rgba(255,255,255,.9)}
.app-tile:focus-visible{outline:2px solid white;outline-offset:2px}
.app-tile:active{filter:brightness(.9)}
.tile-icon{width:52px;height:52px;fill:currentColor}
.tile-label{position:absolute;left:12px;bottom:9px;font-size:13px;font-weight:400}
.tile-subtitle{position:absolute;left:12px;top:10px;font-size:11px;opacity:.85}
.footer{position:fixed;bottom:0;left:0;right:0;height:25px;background:#061733;display:flex;align-items:center;padding:0 18px;color:#9cacc2;font-size:11px}
.footer .line{height:5px;background:#8e9caf;width:min(42vw,460px);margin-right:12px}
@media(max-width:700px){
 body{background:#000}
 .start{padding:10px 20px 30px;min-height:100vh}
 .top{display:none}
 .content{width:100%;max-width:480px;margin:28px auto 0}
 .section-title{font-size:15px;margin:0 0 10px 1px;color:#ddd}
 .app-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:auto;gap:8px;width:100%}
 .app-tile{grid-column:span 2;aspect-ratio:1/1}
 .tile-icon{width:42%;height:42%}
 .tile-label{left:9px;bottom:9px;font-size:15px}
 .tile-subtitle{font-size:10px;left:9px;top:9px}
 .footer{display:none}
}
@media(max-width:360px){
 .start{padding-left:14px;padding-right:14px}
 .content{margin-top:20px}
 .app-grid{gap:6px}
 .tile-label{font-size:13px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<main class="start">
  <header class="top">
    <h1>Start</h1>
    <div class="account"><span>User</span><span class="account-icon" aria-hidden="true">
      <svg viewBox="0 0 30 30" width="30" height="30"><circle cx="15" cy="9" r="6" fill="#fff"/><path d="M3 29c0-8 4-13 12-13s12 5 12 13" fill="#fff"/></svg>
    </span></div>
  </header>
  <section class="content" aria-label="Apps">
    <div class="app-grid">
      <a class="app-tile" href="./attendance.html" aria-label="Open Attendance Tracker">
        <span class="tile-subtitle">SCHOOL</span>
        <svg class="tile-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M15 5h18a3 3 0 0 1 3 3v3h4a3 3 0 0 1 3 3v26a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V14a3 3 0 0 1 3-3h4V8a3 3 0 0 1 3-3zm1 5v5h16v-5zm-4 11v3h5v-3zm9 0v3h17v-3zm-9 7v3h5v-3zm9 0v3h17v-3zm-9 7v3h5v-3zm9 0v3h17v-3z"/>
        </svg>
        <span class="tile-label">Attendance</span>
      </a>
      <a class="app-tile info-tile" href="./info.html" aria-label="Open Info">
        <span class="tile-subtitle">INFORMATION</span>
        <svg class="tile-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 3a21 21 0 1 0 0 42 21 21 0 0 0 0-42zm0 6a2.8 2.8 0 1 1 0 5.6A2.8 2.8 0 0 1 24 9zm4.2 28h-8.4v-3h2.1V22h-2.1v-3h6.3v15h2.1z"/>
        </svg>
        <span class="tile-label">Info</span>
      </a>
    </div>
  </section>
</main>
<div class="footer" aria-hidden="true"><span class="line"></span><span>Start</span></div>
</body>
</html>
