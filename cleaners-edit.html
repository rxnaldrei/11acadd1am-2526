<title>11 ACAD D1 - Edit Cleaners</title>
<style>
@font-face{font-family:"SF Pro Text";src:url("SF-Pro-Text-Medium.otf") format("opentype");font-style:normal;font-weight:500;font-display:swap}
@font-face{font-family:"SF Pro Text";src:url("SF-Pro-Text-Bold.otf") format("opentype");font-style:normal;font-weight:700;font-display:swap}
@font-face{font-family:"SF Pro Text";src:url("SF-Pro-Text-Heavy.otf") format("opentype");font-style:normal;font-weight:800;font-display:swap}
@font-face{font-family:"SF Pro Text";src:url("SF-Pro-Text-Black.otf") format("opentype");font-style:normal;font-weight:900;font-display:swap}
@font-face{font-family:"Commuters Sans Bold";src:url("commuterssans-bold.otf") format("opentype");font-style:normal;font-weight:700;font-display:swap}
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --label:#000000; --label2:rgba(60,60,67,.6); --sep:rgba(60,60,67,.18);
  --fill:rgba(120,120,128,.12); --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30;
  --blur:rgba(242,242,247,.78); color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --label:#FFFFFF; --label2:rgba(235,235,245,.6); --sep:rgba(84,84,88,.6);
    --fill:rgba(120,120,128,.24); --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A;
    --blur:rgba(0,0,0,.72); color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);min-height:100%;}
body{margin:0;position:relative;isolation:isolate;background:transparent;color:var(--label);
  font-family:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:500;
  font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased}
/* Use Commuters Sans only for the class/year label. */
.class-title{font-family:"Commuters Sans Bold","SF Pro Text",sans-serif!important;font-weight:700!important}

  /* Blurred aurora confined to the top of the viewport, fading into a dark base beneath it */
  html { background: #05060a; }
  body::before { content: ""; position: fixed; z-index: -2; inset: 0; pointer-events: none; background: #05060a; }
  body::after {
    content: "";
    position: fixed;
    z-index: -1;
    left: -22%;
    right: -22%;
    top: -22%;
    height: 85vh;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 15% 16%, rgba(111,20,63,.78) 0%, rgba(111,20,63,0) 42%),
      radial-gradient(ellipse at 79% 18%, rgba(112,65,31,.72) 0%, rgba(112,65,31,0) 39%),
      radial-gradient(ellipse at 18% 78%, rgba(43,23,112,.88) 0%, rgba(43,23,112,0) 43%),
      radial-gradient(ellipse at 78% 78%, rgba(12,49,72,.82) 0%, rgba(12,49,72,0) 42%),
      radial-gradient(ellipse at 49% 45%, rgba(63,22,64,.38) 0%, rgba(63,22,64,0) 45%),
      linear-gradient(145deg, #21101d 0%, #151022 48%, #081722 100%);
    background-size: 145% 145%;
    background-position: 50% 30%;
    filter: blur(62px) saturate(125%);
    opacity: .96;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 92%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 92%);
    transform: translate3d(0,0,0);
    animation: auroraDrift 22s ease-in-out infinite alternate;
  }
  /* Driven purely by transform (no background-position) so the browser only
     has to recomposite an already-blurred layer each frame, not re-blur it. */
  @keyframes auroraDrift {
    0% { transform: translate3d(-3%,1%,0) scale(1.05); }
    35% { transform: translate3d(3%,-1.5%,0) scale(1.12); }
    70% { transform: translate3d(-1.5%,2%,0) scale(1.08); }
    100% { transform: translate3d(2.5%,-0.5%,0) scale(1.14); }
  }

button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px}

.nav{position:sticky;top:0;z-index:5;padding:env(safe-area-inset-top,0px) 0 0;
  background:linear-gradient(135deg,rgba(255,255,255,.56),rgba(255,255,255,.24) 48%,rgba(255,255,255,.12)),rgba(245,248,255,.18);
  -webkit-backdrop-filter:saturate(220%) blur(34px);backdrop-filter:saturate(220%) blur(34px);
  border-bottom:1px solid rgba(255,255,255,.72);box-shadow:0 1px 0 rgba(255,255,255,.72) inset,0 12px 38px rgba(40,60,110,.12);transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--sep)}
.wrap{max-width:680px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.nav .wrap{padding-top:10px;padding-bottom:10px}
h1{margin:0;font-size:clamp(25px,6vw,34px);font-weight:700;letter-spacing:-.8px;line-height:1.12}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.title-stack{min-width:0;display:flex;flex-direction:column;gap:5px}
.subtitle{font-size:11px;font-weight:600;letter-spacing:.65px;text-transform:uppercase;color:var(--label2);line-height:1.3}
.lock-btn{flex:none;width:38px;height:38px;padding:0;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.28);color:var(--label);border:1px solid rgba(255,255,255,.52);box-shadow:0 1px 2px rgba(0,0,0,.04),0 1px 0 rgba(255,255,255,.65) inset;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:background .15s,transform .15s}
.lock-btn svg{width:19px;height:19px;display:block}
.lock-btn:active{background:var(--fill);transform:scale(.94)}
.lock-btn:disabled{opacity:.55;cursor:default}
.readonly-note{margin:8px 0 12px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--orange) 12%,transparent);border:1px solid color-mix(in srgb,var(--orange) 20%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--label);font-size:14px}
.thursday-notice{display:flex;align-items:flex-start;gap:10px;margin:12px 0;padding:13px 15px;border-radius:16px;background:color-mix(in srgb,var(--orange) 13%,transparent);border:1px solid color-mix(in srgb,var(--orange) 27%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--label);font-size:14px;line-height:1.45}
.thursday-notice[hidden]{display:none}
.thursday-notice .notice-icon{flex:0 0 auto;font-size:17px;line-height:1.3}
.thursday-notice strong{display:block;margin-bottom:2px;font-weight:700}
.search{margin-top:12px;display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(255,255,255,.50),rgba(255,255,255,.20));border:1px solid rgba(255,255,255,.72);border-radius:16px;padding:9px 12px;box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 5px 18px rgba(50,70,120,.06);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.search svg{flex:none;width:16px;height:16px;opacity:.6}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:17px}
.search input::placeholder{color:var(--label2)}

main{padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
.group{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.58),rgba(255,255,255,.24) 55%,rgba(255,255,255,.17));border:1px solid rgba(255,255,255,.78);border-radius:22px;overflow:hidden;margin:0 0 12px;box-shadow:0 1px 0 rgba(255,255,255,.85) inset,0 -1px 0 rgba(255,255,255,.18) inset,0 12px 34px rgba(40,55,100,.12);-webkit-backdrop-filter:saturate(210%) blur(28px);backdrop-filter:saturate(210%) blur(28px)}
.head{margin:24px 16px 7px;font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:-.08px;display:flex;justify-content:space-between}
.foot{margin:7px 16px 0;font-size:13px;color:var(--label2)}

.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:56px;right:0;height:.5px;background:var(--sep)}
.date-row{justify-content:center}
.date-row input{background:rgba(120,120,128,.10);border:1px solid rgba(255,255,255,.48);border-radius:11px;padding:6px 10px;font-size:17px;min-width:0}
.chev{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--blue);font-size:22px;line-height:1}
.chev:active{background:var(--fill)}
.date-row .mid{display:flex;align-items:center;gap:4px;flex:1;justify-content:center}
.today{color:var(--blue);font-size:17px;padding:6px 8px;border-radius:8px}

.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stat{padding:14px 8px;text-align:center}
.stat+.stat{border-left:.5px solid var(--sep)}
.stat b{display:block;font-size:28px;font-weight:700;letter-spacing:.36px}
.stat span{font-size:13px;color:var(--label2)}
.stat.p b{color:var(--green)} .stat.l b{color:var(--orange)} .stat.a b{color:var(--red)} .stat.e b{color:var(--blue)}

.check{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--label2);display:grid;place-items:center;
  color:#fff;font-size:14px;font-weight:700;transition:background .15s,border-color .15s,transform .15s}
.check:active{transform:scale(.88)}
.check svg{width:15px;height:15px;display:none}
.s-present .check{background:var(--green);border-color:var(--green)}
.s-present .check svg{display:block}
.s-late .check{background:var(--orange);border-color:var(--orange)}
.s-absent .check{background:var(--red);border-color:var(--red)}
.name{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}
.s-absent .name{color:var(--label2)}
.pills{display:flex;gap:6px;flex:none}
.pill{padding:5px 11px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:500;color:var(--label2);transition:background .15s,color .15s}
.pill.late[aria-pressed=true]{background:var(--orange);color:#fff}
.pill.absent[aria-pressed=true]{background:var(--red);color:#fff}
.days{max-height:340px;overflow-y:scroll;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--label2) transparent}
/* Override .group and .liquidGlass overflow:hidden so All Days can actually scroll. */
.group.days.liquidGlass{max-height:340px;overflow-y:scroll!important;overflow-x:hidden!important;scrollbar-gutter:stable;scrollbar-width:auto;scrollbar-color:var(--label2) rgba(120,120,128,.12)}
.group.days.liquidGlass::-webkit-scrollbar{width:10px}
.group.days.liquidGlass::-webkit-scrollbar-track{background:rgba(120,120,128,.12);border-radius:999px}
.group.days.liquidGlass::-webkit-scrollbar-thumb{background:var(--label2);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
.group.days.liquidGlass::-webkit-scrollbar-thumb:hover{background:var(--label);border:2px solid transparent;background-clip:padding-box}
.days::-webkit-scrollbar{width:8px}
.days::-webkit-scrollbar-track{background:transparent}
.days::-webkit-scrollbar-thumb{background:var(--label2);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
.days::-webkit-scrollbar-thumb:hover{background:var(--label);border:2px solid transparent;background-clip:padding-box}
.day-row{width:100%;text-align:left;display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 16px;position:relative}
.day-row+.day-row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.day-row:active{background:var(--fill)}
.day-row.sel{background:var(--fill)}
.day-row .dn{flex:1;min-width:0}
.day-row .dn small{display:block;font-size:13px;color:var(--label2)}
.day-row .dc{display:flex;gap:10px;font-size:15px;font-weight:600}
.day-row .dc .p{color:var(--green)} .day-row .dc .l{color:var(--orange)} .day-row .dc .a{color:var(--red)} .day-row .dc .e{color:var(--blue)}
.day-row .none{font-size:14px;font-weight:400;color:var(--label2)}
.empty{padding:18px 16px;color:var(--label2);text-align:center}

.action{width:100%;text-align:left;padding:11px 16px;font-size:17px;color:var(--blue);display:block;min-height:44px;position:relative}
.action+.action::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.action:active{background:var(--fill)}
.action.danger{color:var(--red)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(92vw,420px);
  background:rgba(40,40,42,.82);border:1px solid rgba(255,255,255,.22);box-shadow:0 12px 36px rgba(0,0,0,.18),0 1px 0 rgba(255,255,255,.16) inset;color:#fff;padding:12px 18px;border-radius:20px;font-size:15px;text-align:center;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-color-scheme:dark){
  .nav{background:linear-gradient(135deg,rgba(35,39,52,.66),rgba(25,27,38,.38) 55%,rgba(18,20,30,.30));border-bottom-color:rgba(255,255,255,.24);box-shadow:0 1px 0 rgba(255,255,255,.20) inset,0 12px 38px rgba(0,0,0,.20);-webkit-backdrop-filter:saturate(200%) blur(36px);backdrop-filter:saturate(200%) blur(36px)}
  .group{background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.055) 60%,rgba(255,255,255,.09));border-color:rgba(255,255,255,.24);box-shadow:0 1px 0 rgba(255,255,255,.26) inset,0 -1px 0 rgba(255,255,255,.05) inset,0 14px 36px rgba(0,0,0,.22);-webkit-backdrop-filter:saturate(190%) blur(30px);backdrop-filter:saturate(190%) blur(30px)}
  .lock-btn{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);box-shadow:0 1px 0 rgba(255,255,255,.08) inset}
  .search{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.055));border-color:rgba(255,255,255,.24);box-shadow:0 1px 0 rgba(255,255,255,.20) inset,0 8px 24px rgba(0,0,0,.10)}
  .date-row input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
}
@media (max-width:480px){.pills{gap:4px}.pill{padding:5px 8px;font-size:13px}.stat b{font-size:24px}}
@media (max-width:380px){.pill{padding:5px 6px;font-size:12px}.row{gap:10px;padding:8px 12px}.row+.row::before{left:50px}}


/* Integrated Liquid-Glass-CSS-inspired refraction layer (local, no CDN required) */
.liquidGlass{position:relative;isolation:isolate;overflow:hidden;}
.liquidGlass::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);filter:url(#liquidGlassFilter2);opacity:.42;}
.liquidGlass::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.015) 55%,rgba(255,255,255,.055));box-shadow:inset 1px 1px 2px rgba(255,255,255,.42),inset -1px -2px 3px rgba(20,20,30,.16);}
.liquidGlass>*{position:relative;z-index:1;}
.nav.liquidGlass::before{opacity:.28;backdrop-filter:blur(10px) saturate(180%);-webkit-backdrop-filter:blur(10px) saturate(180%)}
.group.liquidGlass::before{opacity:.48;backdrop-filter:blur(7px) saturate(155%);-webkit-backdrop-filter:blur(7px) saturate(155%)}
button.liquidGlass{overflow:hidden;}
button.liquidGlass::before,button.liquidGlass::after{border-radius:inherit;}
@media(prefers-reduced-transparency:reduce){.liquidGlass::before{filter:none;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:.2}}


/* Minimal frosted-glass finish: blur only, no refraction, shine, or glossy gradients. */
.liquidGlass{isolation:auto!important;}
.liquidGlass::before,.liquidGlass::after{content:none!important;display:none!important;filter:none!important;}
.liquidGlass>*{position:static;z-index:auto;}
.nav,.nav.liquidGlass{background:rgba(245,247,252,.60)!important;border-bottom:1px solid rgba(255,255,255,.22)!important;box-shadow:none!important;-webkit-backdrop-filter:blur(24px)!important;backdrop-filter:blur(24px)!important;}
.group,.group.liquidGlass{background:rgba(245,247,252,.43)!important;border:1px solid rgba(255,255,255,.24)!important;box-shadow:none!important;-webkit-backdrop-filter:blur(22px)!important;backdrop-filter:blur(22px)!important;}
.search,.search.liquidGlass{background:rgba(245,247,252,.38)!important;border:1px solid rgba(255,255,255,.24)!important;box-shadow:none!important;-webkit-backdrop-filter:blur(18px)!important;backdrop-filter:blur(18px)!important;}
.lock-btn,.lock-btn.liquidGlass,.chev.liquidGlass,.today.liquidGlass,.action.liquidGlass{background:rgba(245,247,252,.28)!important;border:1px solid rgba(255,255,255,.20)!important;box-shadow:none!important;-webkit-backdrop-filter:blur(14px)!important;backdrop-filter:blur(14px)!important;}
.toast{box-shadow:none!important;-webkit-backdrop-filter:blur(22px)!important;backdrop-filter:blur(22px)!important;}
@media(prefers-color-scheme:dark){
 .nav,.nav.liquidGlass{background:rgba(22,24,35,.58)!important;border-bottom-color:rgba(255,255,255,.12)!important;}
 .group,.group.liquidGlass{background:rgba(22,24,35,.48)!important;border-color:rgba(255,255,255,.12)!important;}
 .search,.search.liquidGlass{background:rgba(22,24,35,.40)!important;border-color:rgba(255,255,255,.12)!important;}
 .lock-btn,.lock-btn.liquidGlass,.chev.liquidGlass,.today.liquidGlass,.action.liquidGlass{background:rgba(255,255,255,.06)!important;border-color:rgba(255,255,255,.12)!important;}
}

/* Mobile perf: many stacked backdrop-filter layers are costly to composite/repaint on phones.
   Keep blur only on the sticky nav (the one surface that needs to read over moving content);
   everything else gets a solid-enough background instead, which is nearly free to render. */
@media (max-width:700px){
  .group,.group.liquidGlass,.search,.search.liquidGlass,
  .lock-btn,.lock-btn.liquidGlass,.chev.liquidGlass,.today.liquidGlass,.action.liquidGlass,
  .toast{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;}
  .group,.group.liquidGlass{background:#1c1d24!important;border-color:rgba(255,255,255,.10)!important;}
  .search,.search.liquidGlass{background:#23242c!important;border-color:rgba(255,255,255,.10)!important;}
  .lock-btn,.lock-btn.liquidGlass,.chev.liquidGlass,.today.liquidGlass,.action.liquidGlass{background:#2a2b34!important;border-color:rgba(255,255,255,.10)!important;}
  .toast{background:#23242c!important;}
}
@media (max-width:700px) and (prefers-color-scheme:light){
  .group,.group.liquidGlass{background:#eef0f5!important;border-color:rgba(0,0,0,.06)!important;}
  .search,.search.liquidGlass{background:#e6e9ef!important;border-color:rgba(0,0,0,.06)!important;}
  .lock-btn,.lock-btn.liquidGlass,.chev.liquidGlass,.today.liquidGlass,.action.liquidGlass{background:#e2e5ec!important;border-color:rgba(0,0,0,.06)!important;}
  .toast{background:#e6e9ef!important;}
}

/* Desktop compact two-column workspace: roster and calendar left, controls right. */
@media (min-width: 900px){
  .nav .wrap{max-width:1600px;padding-left:28px;padding-right:28px}
  main.wrap{max-width:1600px;width:100%;padding:18px 28px 48px}
  .desktop-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,350px);gap:20px;align-items:start}
  .desktop-left,.desktop-right{min-width:0}
  .desktop-left #lists{min-width:0}
  .desktop-left .group{margin-bottom:12px}
  .desktop-right .head{margin:2px 4px 7px}
  .desktop-right .group{margin-bottom:12px}
  .desktop-right .foot{margin:0 4px 16px;line-height:1.4}
  .desktop-right .thursday-notice{margin:0 0 12px}
  .desktop-right .stats{margin-bottom:12px}
  .desktop-right .readonly-note{margin:0 0 12px}
  .desktop-right .date-panel{margin-top:0!important}
  .desktop-right .actions-panel{margin-top:0}
  .desktop-right .action{padding:10px 14px;font-size:15px;min-height:42px}
  .desktop-right .action+.action::before{left:14px}
  .desktop-left .head{margin:16px 4px 7px}
  .desktop-left .days{max-height:360px}
}
@media (max-width:899px){
  .desktop-columns,.desktop-left,.desktop-right{display:contents}
  main.wrap{display:flex;flex-direction:column}
  .desktop-date{order:1}.desktop-actions-head{order:2}.desktop-actions{order:3}
  .desktop-sync-foot{order:4}.desktop-notice{order:5}.desktop-stats{order:6}
  #unmarked{order:7}.desktop-readonly{order:8}#lists{order:9}
  .desktop-days-head{order:10}#days{order:11}.desktop-days-foot{order:12}
}


/* Extra mobile scroll optimization: avoid repainting large blurred/fixed layers while scrolling. */
@media (max-width:700px){
  html,body{overscroll-behavior-y:auto;}
  .nav,.nav.liquidGlass{
    -webkit-backdrop-filter:none!important;backdrop-filter:none!important;
    background:rgba(22,24,35,.92)!important;box-shadow:none!important;
    transition:none!important;
  }
  .group,.group.liquidGlass,.search,.search.liquidGlass,
  .lock-btn,.lock-btn.liquidGlass,.chev.liquidGlass,.today.liquidGlass,.action.liquidGlass,
  .toast{
    -webkit-backdrop-filter:none!important;backdrop-filter:none!important;
    box-shadow:none!important;
  }
  .group,.group.liquidGlass{contain:layout paint;}
  .nav .wrap{transform:none!important;}

<script>
(function(){
  var sync=document.getElementById('sync');
  if(sync){
    var busy=false, resetTimer;
    sync.addEventListener('click',function(){
      if(busy)return; busy=true;
      var original='Save to Google Sheets'; sync.textContent='Saving...';
      clearTimeout(resetTimer);
      resetTimer=setTimeout(function(){sync.textContent=original;busy=false;},12000);
      // Restore as soon as the Apps Script request settles, if it is made through fetch.
      var started=Date.now();
      var watch=setInterval(function(){
        if(Date.now()-started>=12000){clearInterval(watch);sync.textContent=original;busy=false;}
      },500);
    },true);
  }
  var unmarked=document.getElementById('allUnmarked');
  if(unmarked){unmarked.addEventListener('click',function(){
    document.querySelectorAll('#cleanerDays .cleaner-check').forEach(function(box){
      if(box.disabled)return;
      if(box.checked){box.checked=false;box.dispatchEvent(new Event('change',{bubbles:true}));}
    });
    var toast=document.getElementById('toast');
    if(toast){toast.textContent='Everyone set to unmarked';toast.classList.add('show');clearTimeout(window.__cleanersToastTimer);window.__cleanersToastTimer=setTimeout(function(){toast.classList.remove('show');},2600);}
  });}
})();
</script>
