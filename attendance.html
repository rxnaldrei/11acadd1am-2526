<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>11 ACAD D1 - Attendance</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
@font-face{font-family:"SF Pro Text";src:url("SF-Pro-Text-Regular.otf") format("opentype");font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:"SF Pro Text";src:url("SF-Pro-Text-Medium.otf") format("opentype");font-style:normal;font-weight:500;font-display:swap}
@font-face{font-family:"SF Pro Text";src:url("SF-Pro-Text-Bold.otf") format("opentype");font-style:normal;font-weight:700;font-display:swap}
@font-face{font-family:"SF Pro Text";src:url("SF-Pro-Text-Heavy.otf") format("opentype");font-style:normal;font-weight:800;font-display:swap}
@font-face{font-family:"SF Pro Text";src:url("SF-Pro-Text-Black.otf") format("opentype");font-style:normal;font-weight:900;font-display:swap}
@font-face{font-family:"Commuters Sans Bold";src:url("commuterssans-bold.otf") format("opentype");font-style:normal;font-weight:700;font-display:swap}

:root{
  --bg:#F2F2F7; --label:#000000; --label2:rgba(60,60,67,.6); --sep:rgba(60,60,67,.18);
  --fill:rgba(120,120,128,.12); --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30;
  /* Surfaces (translucent frosted glass on desktop; made opaque on <=700px below) */
  --s-nav:rgba(245,247,252,.60); --s-group:rgba(245,247,252,.43); --s-field:rgba(245,247,252,.38); --s-chip:rgba(245,247,252,.28);
  --s-border:rgba(255,255,255,.24); --s-nav-border:rgba(255,255,255,.22);
  --on-bg:rgba(235,235,245,.6); /* text that sits directly on the dark page background */
  --space:16px; --gap:12px; --radius:22px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --label:#FFFFFF; --label2:rgba(235,235,245,.6); --sep:rgba(84,84,88,.6);
    --fill:rgba(120,120,128,.24); --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A;
    --s-nav:rgba(22,24,35,.58); --s-group:rgba(22,24,35,.48); --s-field:rgba(22,24,35,.40); --s-chip:rgba(255,255,255,.06);
    --s-border:rgba(255,255,255,.12); --s-nav-border:rgba(255,255,255,.12);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none}
input{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text}
html{background:#05060a;min-height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{overflow-x:hidden}
body{margin:0;position:relative;isolation:isolate;background:transparent;color:var(--label);
  font-family:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:500;font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px)}
/* Commuters Sans only for the class/year label. */
.class-title{font-family:"Commuters Sans Bold","SF Pro Text",sans-serif!important;font-weight:700!important}

/* Blurred aurora confined to the top of the viewport, fading into a dark base beneath it */
html{background:#05060a}
body::before{content:"";position:fixed;z-index:-2;inset:0;pointer-events:none;background:#05060a}
body::after{content:"";position:fixed;z-index:-1;left:-22%;right:-22%;top:-22%;height:85vh;pointer-events:none;background:
  radial-gradient(ellipse at 15% 16%,rgba(111,20,63,.78) 0%,rgba(111,20,63,0) 42%),
  radial-gradient(ellipse at 79% 18%,rgba(112,65,31,.72) 0%,rgba(112,65,31,0) 39%),
  radial-gradient(ellipse at 18% 78%,rgba(43,23,112,.88) 0%,rgba(43,23,112,0) 43%),
  radial-gradient(ellipse at 78% 78%,rgba(12,49,72,.82) 0%,rgba(12,49,72,0) 42%),
  radial-gradient(ellipse at 49% 45%,rgba(63,22,64,.38) 0%,rgba(63,22,64,0) 45%),
  linear-gradient(145deg,#21101d 0%,#151022 48%,#081722 100%);
  background-size:145% 145%;filter:blur(62px) saturate(125%);opacity:.96;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 45%,transparent 92%);
  mask-image:linear-gradient(to bottom,#000 0%,#000 45%,transparent 92%);
  transform:translate3d(0,0,0);will-change:transform;animation:auroraDrift 22s ease-in-out infinite alternate}
@keyframes auroraDrift{0%{background-position:0% 10%;transform:translate3d(-2%,1%,0) scale(1)}35%{background-position:85% 15%;transform:translate3d(2%,-1%,0) scale(1.08)}70%{background-position:40% 95%;transform:translate3d(-1%,2%,0) scale(1.03)}100%{background-position:100% 60%;transform:translate3d(2%,0,0) scale(1.1)}}
@media (prefers-reduced-motion:reduce){body::after{animation:none}}
@media (max-width:700px){
  /* Keep both page and login backgrounds static on phones to reduce repaint/compositing load. */
  body::after{animation:none;filter:blur(40px) saturate(125%);transform:none;background-position:50% 50%;will-change:auto}
  #password-gate::before{animation:none!important;filter:blur(40px) saturate(125%);transform:none!important;background-position:50% 50%;will-change:auto}
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px}

.wrap{max-width:1100px;margin:0 auto;padding:0 max(var(--space),env(safe-area-inset-left,0px)) 0 max(var(--space),env(safe-area-inset-right,0px))}

/* ---------- Nav ---------- */
.nav{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);
  background:var(--s-nav);border-bottom:1px solid var(--s-nav-border);
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--sep)}
.nav .wrap{padding-top:20px;padding-bottom:22px}
h1{margin:0;font-size:clamp(25px,6vw,34px);font-weight:700;letter-spacing:-.8px;line-height:1.2}
.titlebar{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--gap)}
.title-stack{min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:2px}
.subtitle{font-size:11px;font-weight:600;letter-spacing:.65px;text-transform:uppercase;color:var(--label2);line-height:1.3}
.view-badge{flex:none;display:flex;align-items:center;gap:6px;height:38px;padding:0 14px 0 11px;border-radius:999px;
  background:var(--s-chip);border:1px solid var(--s-border);color:var(--label);font-size:13px;font-weight:600;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.view-badge svg{width:16px;height:16px;display:block;flex:none}

.search{margin-top:18px;display:flex;align-items:center;gap:8px;min-height:44px;background:var(--s-field);border:1px solid var(--s-border);
  border-radius:16px;padding:0 12px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.search svg{flex:none;width:16px;height:16px;opacity:.6}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:17px;height:42px}
.search input::placeholder{color:var(--label2)}

.date-row{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:4px}
.chev{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--blue);font-size:24px;line-height:1}
.chev:active{background:var(--fill)}
.date-row input{background:var(--s-chip);border:1px solid var(--s-border);border-radius:11px;padding:7px 10px;font-size:16px;min-width:0;height:36px}
.today-btn{color:var(--blue);font-size:16px;padding:8px 10px;border-radius:8px;margin-left:2px}
.today-btn:active{background:var(--fill)}

/* ---------- Content ---------- */
main{padding-top:46px;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.glass{background:var(--s-group);border:1px solid var(--s-border);border-radius:var(--radius);overflow:hidden;
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px}
.stat{padding:14px 8px;text-align:center}
.stat+.stat{border-left:.5px solid var(--sep)}
.stat b{display:block;font-size:26px;font-weight:700;letter-spacing:.3px;line-height:1.2}
.stat span{font-size:13px;color:var(--label2)}
.stat.p b{color:var(--green)} .stat.l b{color:var(--orange)} .stat.a b{color:var(--red)} .stat.e b{color:var(--blue)}

.section-head{margin:24px 4px 8px;font-size:13px;color:var(--on-bg);text-transform:uppercase;letter-spacing:-.08px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);align-items:start}
.col-head{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:10px 16px;font-size:15px;font-weight:700;
  border-bottom:.5px solid var(--sep)}
.col-head.s-present{color:var(--green)}
.col-head.s-late{color:var(--orange)}
.col-head.s-absent{color:var(--red)}
.col-count{font-size:13px;font-weight:700;min-width:28px;text-align:center;padding:2px 9px;border-radius:999px;background:var(--fill);color:var(--label)}

.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:37px;right:0;height:.5px;background:var(--sep)}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--label2)}
.s-present .dot{background:var(--green)}
.s-late .dot{background:var(--orange)}
.s-absent .dot{background:var(--red)}
.name{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}
.s-absent .name{color:var(--label2)}
.empty{padding:18px 16px;color:var(--label2);text-align:center;font-size:15px}

.unavailable{grid-column:1 / -1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:56px 20px;text-align:center}
.unavailable-title{font-size:clamp(19px,4.6vw,24px);font-weight:700;letter-spacing:-.3px;line-height:1.3}
.unavailable-sub{font-size:14px;color:var(--label2)}
.load-state{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 16px;color:var(--on-bg);font-size:15px;text-align:center}
.spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(255,255,255,.16);border-top-color:var(--blue);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Floating sync button ---------- */
.sync-fab-wrap{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));
  z-index:30;display:inline-flex;border-radius:999px;padding:2px;isolation:isolate;overflow:hidden;
  transition:opacity .35s ease,transform .35s cubic-bezier(.3,1.4,.5,1),visibility .35s,box-shadow .35s ease}
.sync-fab-wrap.hidden-fab{opacity:0;visibility:hidden;transform:translateY(12px) scale(.94);pointer-events:none}
.sync-fab-wrap::before{content:"";position:absolute;z-index:-1;inset:-60%;
  background:conic-gradient(from 0deg,var(--blue) 0deg,#fff 90deg,var(--blue) 180deg,#fff 270deg,var(--blue) 360deg);
  opacity:0;transition:opacity .25s ease}
.sync-fab-wrap.syncing::before{opacity:1;animation:ringSpin 1.1s linear infinite}
@keyframes ringSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sync-fab-wrap.syncing::before{animation:none}}
.sync-fab-wrap.synced{box-shadow:0 0 22px 2px color-mix(in srgb,var(--green) 50%,transparent)}

.sync-fab{position:relative;display:flex;align-items:center;justify-content:center;padding:17px 34px;border-radius:999px;
  background:rgba(28,28,30,.92);color:#fff;
  font-size:18px;font-weight:700;letter-spacing:.1px;
  transition:transform .3s cubic-bezier(.3,1.4,.5,1),box-shadow .35s ease,background .35s ease}
.sync-fab-wrap:not(.syncing):not(.synced) .sync-fab{background:rgba(28,28,30,.78);border:1px solid rgba(255,255,255,.18)}
.sync-fab-wrap:active .sync-fab{transform:scale(.96)}
.sync-fab-wrap.syncing .sync-fab{pointer-events:none}
.sync-fab-wrap.synced .sync-fab{transform:scale(1.08);
  background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--green) 38%,rgba(28,28,30,.92)) 0%,rgba(28,28,30,.92) 78%);
  box-shadow:inset 0 0 18px 2px color-mix(in srgb,var(--green) 65%,transparent)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(92vw,420px);
  background:rgba(40,40,42,.82);border:1px solid rgba(255,255,255,.22);color:#fff;padding:12px 18px;border-radius:20px;
  font-size:15px;text-align:center;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);z-index:25}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:899px){
  html,body{width:100%;max-width:100%}
  .wrap{width:100%}
}
@media (max-width:760px){.cols{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.cols{grid-template-columns:1fr}}

/* ---------- <=700px: opaque UI, static background, no backdrop blur (smooth scrolling) ---------- */
@media (max-width:700px){
  :root{
    --s-nav:#f5f7fc; --s-group:#eef0f5; --s-field:#e6e9ef; --s-chip:#e2e5ec;
    --s-border:rgba(0,0,0,.06); --s-nav-border:rgba(0,0,0,.08);
  }
  .nav,.glass,.search,.view-badge,.toast,.date-row input{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  /* Static aurora: no animation, no blur filter, scrolls with the page instead of being re-composited */
  body::before{position:absolute;inset:0}
  body::after{position:absolute;left:-8%;right:-8%;top:0;height:480px;filter:none;transform:none;animation:none;
    background-size:100% 100%;background-position:50% 50%;will-change:auto;
    -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 45%,transparent 100%);
    mask-image:linear-gradient(to bottom,#000 0%,#000 45%,transparent 100%)}
  .nav{transition:none}
  .nav .wrap{padding-top:16px;padding-bottom:18px}
  .glass{contain:layout paint}
  .sync-fab-wrap{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .sync-fab{background:#1c1d24;padding:18px 34px;font-size:19px}
  .sync-fab-wrap:not(.syncing):not(.synced) .sync-fab{background:#1c1d24}
  .toast{background:#23242c}
  .stat b{font-size:22px}
  .stat{padding:12px 4px}
  .stat span{font-size:12px}
  *{scroll-behavior:auto!important}
}
@media (max-width:700px) and (prefers-color-scheme:dark){
  :root{
    --s-nav:#161823; --s-group:#1c1d24; --s-field:#23242c; --s-chip:#2a2b34;
    --s-border:rgba(255,255,255,.10); --s-nav-border:rgba(255,255,255,.10);
  }
}

/* ---------- Design-language alignment with the editable attendance site ---------- */
/* Keep the same restrained Apple-style frosted surfaces, SF typography, and aurora backdrop. */
.nav{
  background:rgba(245,247,252,.60)!important;
  border-bottom:1px solid rgba(255,255,255,.22)!important;
  box-shadow:none!important;
  -webkit-backdrop-filter:blur(24px)!important;
  backdrop-filter:blur(24px)!important;
}
.glass{
  background:rgba(245,247,252,.43)!important;
  border:1px solid rgba(255,255,255,.24)!important;
  box-shadow:none!important;
  -webkit-backdrop-filter:blur(22px)!important;
  backdrop-filter:blur(22px)!important;
}
.search{
  background:rgba(245,247,252,.38)!important;
  border:1px solid rgba(255,255,255,.24)!important;

}
@media(prefers-color-scheme:dark){
  .nav{
    background:rgba(22,24,35,.58)!important;
    border-bottom-color:rgba(255,255,255,.12)!important;
  }

    background:rgba(22,24,35,.48)!important;

  }

/* Match the editable page's low-cost mobile treatment: static aurora and opaque surfaces. */
@media(max-width:700px){
  .nav,.glass,.search,.view-badge,.toast,.date-row input{
    -webkit-backdrop-filter:none!important;backdrop-filter:none!important;
  }
  .glass{background:#1c1d24!important;border-color:rgba(255,255,255,.10)!important;contain:layout paint}
  .search{background:#23242c!important;border-color:rgba(255,255,255,.10)!important}

    -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 45%,transparent 100%);

  }

}
@media(max-width:700px) and (prefers-color-scheme:light){
  .glass{background:#eef0f5!important;border-color:rgba(0,0,0,.06)!important}
  .search{background:#e6e9ef!important;border-color:rgba(0,0,0,.06)!important}
  .view-badge,.date-row input{background:#e2e5ec!important;border-color:rgba(0,0,0,.06)!important}

}


/* Header alignment and detached date controls, matching the editable page layout. */

.titlebar{justify-content:flex-start}
.title-stack{align-items:flex-start}
.search{margin-top:12px}
main.wrap{padding-top:26px}

@media(max-width:700px){
  .wrap{padding-left:16px;padding-right:16px}

/* Fix viewport-dependent aurora cutoff: size the static mobile background to the
   actual visible viewport and fade it smoothly into the dark page base. */
@media (max-width:700px){
  body{min-height:100vh;min-height:100dvh;background:#05060a}
  body::before{position:absolute;inset:0;background:#05060a}
  body::after{
    position:absolute!important;
    top:0!important;left:-8%!important;right:-8%!important;
    width:auto!important;height:100vh!important;height:100dvh!important;
    min-height:520px;
    filter:none!important;transform:none!important;animation:none!important;
    background-size:100% 100%!important;background-position:50% 50%!important;
    will-change:auto!important;
    -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 38%,rgba(0,0,0,.82) 58%,rgba(0,0,0,.35) 78%,transparent 100%)!important;
    mask-image:linear-gradient(to bottom,#000 0%,#000 38%,rgba(0,0,0,.82) 58%,rgba(0,0,0,.35) 78%,transparent 100%)!important;
  }
}


/* Consistent alignment at every viewport width. */

.view-badge{flex:0 0 auto;margin-top:0}

@media(max-width:700px){
  .nav .wrap{padding-left:16px;padding-right:16px}
  .titlebar{justify-content:flex-start!important;gap:10px}
  .title-stack{flex-shrink:0}
  .view-badge{margin-left:0}
  .date-panel{width:min(100%,520px);padding:8px;border-radius:18px}
  .date-row{justify-content:center!important;gap:2px}
  .date-row input{flex:0 1 145px;width:145px;max-width:38vw;padding-left:7px;padding-right:5px}
}
/* Initial cloud load overlay: gives Google Sheets time to respond when there is no cached day. */
#initial-loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:#fff;background:rgba(8,10,18,.34);-webkit-backdrop-filter:blur(18px) saturate(125%);backdrop-filter:blur(18px) saturate(125%);opacity:1;visibility:visible;transition:opacity .28s ease,visibility .28s ease}
#initial-loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
#initial-loader .loader-card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 26px;border:1px solid rgba(255,255,255,.16);border-radius:22px;background:rgba(25,27,39,.78);box-shadow:0 12px 40px rgba(0,0,0,.18)}
#initial-loader .spinner{width:28px;height:28px;border-width:3px}
@media(max-width:700px){#initial-loader{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)} #initial-loader .loader-card{padding:20px 22px}}
@media(prefers-reduced-motion:reduce){#initial-loader{transition:none}}

</style>
</head>
<body>
<div id="initial-loader" aria-live="polite" aria-label="Loading attendance from Google Sheets">
  <div class="loader-card"><div class="spinner"></div><div>Syncing attendance from Google Sheets…</div></div>
</div>

<header class="nav" id="nav">
  <div class="wrap">
    <div class="titlebar">
      <div class="title-stack">
        <h1>Attendance</h1>
        <div class="subtitle class-title">11-ACAD D-1AM <span aria-hidden="true">·</span> 2026–2027</div>
      </div>
      <div class="view-badge" title="Read-only — viewing attendance records">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        View only
      </div>
    </div>
    <label class="search">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
      <input id="query" type="search" placeholder="Search" aria-label="Search names" autocomplete="off" autocapitalize="characters">
    </label>
  </div>
</header>

<main class="wrap">
  <div class="glass date-panel">
    <div class="date-row">
      <button class="chev" id="prevDay" aria-label="Previous day">‹</button>
      <input type="date" id="date" aria-label="Date">
      <button class="chev" id="nextDay" aria-label="Next day">›</button>
      <button class="today-btn" id="todayBtn">Today</button>
    </div>
  </div>
  <div id="loadState" class="load-state">
    <div class="spinner"></div>
    <div>Loading attendance…</div>
  </div>
  <div id="content" style="display:none">
    <div class="glass stats" id="stats" aria-live="polite"></div>
    <div class="section-head" id="dayLabel"></div>
    <div class="cols" id="cols"></div>
  </div>
</main>

<div class="sync-fab-wrap" id="syncFabWrap">
  <button class="sync-fab" id="syncFab" type="button" aria-label="Sync from Google Sheets">Sync</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  // Disable the context menu and copy/drag affordances site-wide.
  document.addEventListener("contextmenu", function(e){ e.preventDefault(); }, false);
  document.addEventListener("dragstart", function(e){ e.preventDefault(); }, false);
  document.addEventListener("selectstart", function(e){
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
    e.preventDefault();
  }, false);
  document.addEventListener("copy", function(e){ e.preventDefault(); }, false);

  // Same roster and Apps Script endpoint as the live tracker. Read-only: no local writes, no edit UI.
  var SYNC_URL = "https://script.google.com/macros/s/AKfycbzUiIAcYWRIWZgiOTWNm_Q2T9Kn0sMVhmIObs-3lemhAc2Ikgdymric-R3eJT41t4_R/exec";
  var ROSTER = [
    "ALABAN, EDMARK JOHN P.","ARAO, MARK KEN C.","AREDIDON, JHON JAYRIC N.","BALLAD, EVON JAMES T.",
    "BARTOLATA, ELIJAH GABRIEL N.","BERIÑO, MICHAEL ANGELO B.","BRAVO, AERON JAYDEN V.","CARRILLO, AKIKO KYLEE L.",
    "CLAUDIO, MARK JOSEPH R.","CONCEPCION, KEAN DALE H.","DIOLA, JAIRUS RAFAEL B.","DOLORES, GIAN CARLO U.",
    "ECHON, JHAY MARCHT E.","ESPAÑOLA, PRINZE DANRIL S.","ESPIRITU, SAMUEL ALDRIN D.","ESTRADA, DRU JACOBE N.",
    "FELIPE, JOHN GREG CARDO R.","FUNTELON, JERALD M.","GALANG, KEVIN RILEY CO GALANG C.","GEVEN, KIAN A.",
    "GUTIERREZ, ANTOINE SCOTT C.","JUANIZA, SEAN DAVID R.","LEBIS., JOSEPH D.","MINDORO, SHAEL JHON A.",
    "MORIS, BERNARD V.","PACATANG, RAINMART ALDREI","PAJO, MARIUS ANDREI T.","PANGILINAN, CHRISTIAN JAZTIN D.",
    "PAYAO, JIMBOY B.","PELAYO, MIGUEL LORENZO D.","REYES, CEDRICK H.","ROQUE, XHENDRICK A.",
    "ROYO, JOHN LAURENCE B.","SALAZAR, RYAN YUAN B.","SANTIAGO, JOAQUIN R.","SILUD, JOMMY S.",
    "TAN, JEORGE VINCENT B.","TEJERO, HAIL KYLIE B.","URSUA JR, JUN Q.",
    "BANECO, MARIEL C.","BERNARDO, JHANICA B.","BOHOL, PRINCESS MAVIE M.","BUATO, NOR-JHUNAIMA M.",
    "DULAY, KAYE XANDRIA D.","ESTRELLA, KEZIAH BERNICE D.","SARCOS, JANELLE RAINE A.","VILLAMOR, ELAIZA T."
  ].filter(function(n){
    var surname = n.split(",")[0].trim().toUpperCase();
    return surname !== "ABAYON" && surname !== "ULIT";
  }).sort(function(a,b){ return a.localeCompare(b); });

  var START_DATE = "2026-07-20";
  var records = {}; // filled by a sync; read-only, never written back

  var $ = function(id){ return document.getElementById(id); };
  function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function shift(str,n){ var p=str.split("-"); return iso(new Date(+p[0],+p[1]-1,+p[2]+n)); }
  function isWeekend(str){ var p=str.split("-"), w=new Date(+p[0],+p[1]-1,+p[2]).getDay(); return w===0||w===6; }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
    });
  }

  var current = iso(new Date());
  var query = "";
  $("date").value = current;
  $("date").min = START_DATE;

  var recordedDates = [];
  function refreshRecordedDates(){
    recordedDates = Object.keys(records).filter(function(d){
      return records[d] && Object.keys(records[d]).length > 0;
    }).sort();
  }
  function lastRecordedDate(){ return recordedDates.length ? recordedDates[recordedDates.length - 1] : null; }
  // Weekends are skipped: land on the most recent recorded date instead (or the nearest weekday).
  function landOnValidDate(d){
    if (!isWeekend(d)) return d;
    var last = lastRecordedDate();
    if (last) return last;
    var fallback = d, i = 0;
    while (isWeekend(fallback) && i++ < 7) fallback = shift(fallback, -1);
    return fallback;
  }

  function renderStats(d){
    var p=0,l=0,a=0;
    ROSTER.forEach(function(n){
      var st = d[n];
      if (st === "present") p++; else if (st === "late") l++; else if (st === "absent") a++;
    });
    $("stats").innerHTML =
      '<div class="stat p"><b>'+p+'</b><span>Present</span></div>'+
      '<div class="stat l"><b>'+l+'</b><span>Late</span></div>'+
      '<div class="stat a"><b>'+a+'</b><span>Absent</span></div>';
  }
  function render(){
    var hasRecord = !!(records[current] && Object.keys(records[current]).length > 0);
    var d = records[current] || {};
    var dt = new Date(current+"T00:00:00");
    $("dayLabel").textContent = dt.toLocaleDateString(undefined, { weekday:"long", year:"numeric", month:"long", day:"numeric" });

    var q = query.trim().toUpperCase();
    var filtered = ROSTER.filter(function(n){ return !q || n.toUpperCase().indexOf(q) !== -1; });

    if (!hasRecord){
      $("stats").innerHTML = "";
      $("stats").style.display = "none";
      $("cols").innerHTML =
        '<div class="glass unavailable">' +
          '<div class="unavailable-title">Attendance for ' + escapeHtml(dt.toLocaleDateString(undefined, { month:"long", day:"numeric", year:"numeric" })) + ' is not available</div>' +
          '<div class="unavailable-sub">No records were synced for this date.</div>' +
        '</div>';
      return;
    }

    $("stats").style.display = "";
    renderStats(d);

    var groups = { present: [], late: [], absent: [] };
    filtered.forEach(function(n){
      var st = d[n];
      if (st === "present" || st === "late" || st === "absent") groups[st].push(n);
    });

    var cfg = [
      { key:"present", label:"Present", cls:"s-present" },
      { key:"late", label:"Late", cls:"s-late" },
      { key:"absent", label:"Absent", cls:"s-absent" }
    ];
    var html = "";
    cfg.forEach(function(c){
      var list = groups[c.key];
      html += '<div class="glass">';
      html += '<div class="col-head ' + c.cls + '">' + c.label + ' <span class="col-count">' + list.length + '</span></div>';
      if (!list.length){
        html += '<div class="empty">No students</div>';
      } else {
        list.forEach(function(n){
          html += '<div class="row ' + c.cls + '"><span class="dot"></span><span class="name">' + escapeHtml(n) + '</span></div>';
        });
      }
      html += '</div>';
    });
    $("cols").innerHTML = html;
  }

  // Coalesce rapid re-renders (typing in search) into one per frame.
  var renderQueued = false;
  function scheduleRender(){
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(function(){ renderQueued = false; render(); });
  }

  function setDate(d){
    d = landOnValidDate(d);
    current = d; $("date").value = d; render();
  }

  $("date").addEventListener("change", function(){ if (this.value) setDate(this.value); });
  $("prevDay").addEventListener("click", function(){
    var d = shift(current, -1);
    while (isWeekend(d)) d = shift(d, -1);
    setDate(d);
  });
  $("nextDay").addEventListener("click", function(){
    var d = shift(current, 1);
    while (isWeekend(d)) d = shift(d, 1);
    setDate(d);
  });
  $("todayBtn").addEventListener("click", function(){ setDate(iso(new Date())); });
  $("query").addEventListener("input", function(){ query = this.value; scheduleRender(); });

  // ---- Toast ----
  var toastTimer;
  function toast(msg){
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }

  // ---- Sync button states: rotating blue/white ring while syncing, green glow on success ----
  var fab = $("syncFab");
  var fabWrap = $("syncFabWrap");
  var syncStart = 0, syncedTimer, hideTimer, fabBusy = false;
  function armHide(){
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){ if (!fabBusy) fabWrap.classList.add("hidden-fab"); }, 5000);
  }
  function fabSyncing(){
    fabBusy = true;
    syncStart = Date.now();
    clearTimeout(syncedTimer);
    fabWrap.classList.remove("synced", "hidden-fab");
    fabWrap.classList.add("syncing");
    clearTimeout(hideTimer);
  }
  function fabDone(ok){
    // Keep the spinning ring visible for at least ~700ms so fast syncs still give feedback.
    var wait = Math.max(0, 700 - (Date.now() - syncStart));
    setTimeout(function(){
      fabWrap.classList.remove("syncing");
      if (ok){
        fabWrap.classList.add("synced");
        syncedTimer = setTimeout(function(){
          fabWrap.classList.remove("synced");
          fabBusy = false; armHide();
        }, 1800);
      } else {
        fabBusy = false; armHide();
      }
    }, wait);
  }

  // ---- Read-only sync from Google Sheets (JSONP, same endpoint as the live tracker) ----
  var cloudPullInProgress = false;
  var hadFirstSync = false;
  var initialLoaderDismissed = false;
  function dismissInitialLoader(){
    if (initialLoaderDismissed) return;
    initialLoaderDismissed = true;
    var loader = $("initial-loader");
    if (loader) loader.classList.add("hidden");
  }
  function pullFromGoogleSheet(showToast){
    if (cloudPullInProgress) return;
    cloudPullInProgress = true;
    fabSyncing();
    var callbackName = "attReadOnlyCb" + Date.now();
    var script = document.createElement("script");
    var timeoutId = setTimeout(function(){ finish(new Error("Sync timed out"), null); }, 15000);

    function finish(err, payload){
      clearTimeout(timeoutId);
      try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
      cloudPullInProgress = false;
      if (err) { dismissInitialLoader(); fabDone(false); if (showToast) toast("Could not load Google Sheets: " + err.message); return; }
      if (!payload || payload.ok !== true || !payload.history || typeof payload.history !== "object") {
        dismissInitialLoader();
        fabDone(false);
        if (showToast) toast((payload && payload.error) || "Google Sheets read endpoint is not configured yet");
        return;
      }
      function normalizeSheetName(name){ return String(name || "").toLowerCase().replace(/[^a-z0-9ñ]/g, ""); }
      var validNames = {};
      ROSTER.forEach(function(n){ validNames[normalizeSheetName(n)] = n; });
      Object.keys(payload.history).forEach(function(ds){
        if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return;
        var incoming = payload.history[ds] || {};
        var next = {};
        Object.keys(incoming).forEach(function(name){
          var canonicalName = validNames[normalizeSheetName(name)];
          if (!canonicalName) return;
          var status = String(incoming[name] || "").trim().toLowerCase();
          if (["present","late","absent","excused"].indexOf(status) !== -1) next[canonicalName] = status;
        });
        records[ds] = next;
      });
      refreshRecordedDates();
      if (!hadFirstSync){
        hadFirstSync = true;
        current = landOnValidDate(current);
        $("date").value = current;
      }
      render();
      dismissInitialLoader();
      $("loadState").style.display = "none";
      $("content").style.display = "block";
      fabDone(true);
      if (showToast) toast("Attendance refreshed from Google Sheets");
    }
    window[callbackName] = function(payload){ finish(null, payload); };
    script.onerror = function(){ finish(new Error("Could not access the Apps Script read endpoint"), null); };
    script.src = SYNC_URL + (SYNC_URL.indexOf("?") >= 0 ? "&" : "?") + "action=readAll&callback=" + encodeURIComponent(callbackName) + "&_=" + Date.now();
    document.head.appendChild(script);
  }

  fab.addEventListener("click", function(){ pullFromGoogleSheet(true); });

  // Load on open
  pullFromGoogleSheet(false);
  setTimeout(function(){
    if ($("loadState").style.display !== "none"){
      dismissInitialLoader();
      $("loadState").innerHTML = '<div>Could not load attendance yet.</div>';
      var retryBtn = document.createElement("button");
      retryBtn.textContent = "Retry";
      retryBtn.style.cssText = "padding:10px 18px;border-radius:999px;background:var(--blue);color:#fff;font-weight:600;font-size:15px";
      retryBtn.addEventListener("click", function(){
        $("loadState").innerHTML = '<div class="spinner"></div><div>Loading attendance…</div>';
        pullFromGoogleSheet(true);
      });
      $("loadState").appendChild(retryBtn);
    }
  }, 16000);

  // ---- Scroll handling: one passive, rAF-throttled listener that only touches the DOM on change ----
  var nav = $("nav"), navScrolled = false, scrollTicking = false, lastFabPoke = 0;
  function onScrollFrame(){
    scrollTicking = false;
    var s = window.scrollY > 4;
    if (s !== navScrolled){ navScrolled = s; nav.classList.toggle("scrolled", s); }
  }
  function pokeFab(){
    if (fabBusy) return;
    var now = Date.now();
    if (!fabWrap.classList.contains("hidden-fab") && now - lastFabPoke < 600) return;
    lastFabPoke = now;
    fabWrap.classList.remove("hidden-fab");
    armHide();
  }
  window.addEventListener("scroll", function(){
    if (!scrollTicking){ scrollTicking = true; requestAnimationFrame(onScrollFrame); }
    pokeFab();
  }, {passive:true});
  window.addEventListener("touchstart", pokeFab, {passive:true});
  armHide(); // visible on load, then auto-hides after 5s of inactivity (never while syncing)

})();
</script>
</body>
</html>
